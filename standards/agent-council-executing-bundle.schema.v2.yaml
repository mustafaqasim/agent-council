{
  "$schema": "https://json-schema.org/draft/2020-12/schema", "$id": "https://acpl.internal/schemas/cyber-range/agent-council-executing-bundle-v2", "title": "ACPL Agent Council v2 pinned executing case bundle", "type": "object", "additionalProperties": false,
  "description": "Executing bundles are input records. Expected outcomes are excluded so evaluation cannot be directed by fixture-authored answers.",
  "required": ["schema_version", "case_id", "case_root", "cycle_id", "route", "identity", "policy_bundle", "engineering_candidate", "registry", "provider_capability_receipt", "provider_dispatch_receipt", "events"],
  "properties": {
    "schema_version": {"const": "acpl.cyberrange.agent-council-case/v2"}, "case_id": {"type": "string", "pattern": "^[A-Za-z][A-Za-z0-9._-]{2,127}$"}, "case_root": {"type": "string", "minLength": 1}, "cycle_id": {"type": "string", "pattern": "^[A-Za-z][A-Za-z0-9._-]{2,127}$"}, "route": {"enum": ["R1", "R2", "R3"]},
    "identity": {"type": "object", "additionalProperties": false, "required": ["case_id", "policy_bundle_sha256", "registry_version", "registry_sha256"], "properties": {"case_id": {"type": "string"}, "policy_bundle_sha256": {"pattern": "^[a-f0-9]{64}$"}, "registry_version": {"pattern": "^v[0-9]+$"}, "registry_sha256": {"pattern": "^[a-f0-9]{64}$"}}},
    "policy_bundle": {"type": "object", "additionalProperties": false, "required": ["policy_bundle_id", "policy_sha256"], "properties": {"policy_bundle_id": {"type": "string"}, "policy_sha256": {"pattern": "^[a-f0-9]{64}$"}}},
    "engineering_candidate": {"type": "object", "additionalProperties": false, "required": ["candidate_id", "candidate_sha256", "source_sha256", "package_sha256", "dependency_lock_sha256", "harness_sha256", "policy_sha256"], "properties": {"candidate_id": {"type": "string"}, "candidate_sha256": {"pattern": "^[a-f0-9]{64}$"}, "source_sha256": {"pattern": "^[a-f0-9]{64}$"}, "package_sha256": {"pattern": "^[a-f0-9]{64}$"}, "dependency_lock_sha256": {"pattern": "^[a-f0-9]{64}$"}, "harness_sha256": {"pattern": "^[a-f0-9]{64}$"}, "policy_sha256": {"pattern": "^[a-f0-9]{64}$"}}},
    "pinned_schema_sha256": {"pattern": "^[a-f0-9]{64}$"}, "package_schema_sha256": {"pattern": "^[a-f0-9]{64}$"},
    "registry": {"$ref": "https://acpl.internal/schemas/cyber-range/agent-model-registry-v2"}, "provider_capability_receipt": {"$ref": "https://acpl.internal/schemas/cyber-range/provider-capability-receipt-v2"}, "provider_dispatch_receipt": {"$ref": "https://acpl.internal/schemas/cyber-range/provider-dispatch-receipt-v2"}, "events": {"type": "array", "minItems": 4, "items": {"$ref": "https://acpl.internal/schemas/cyber-range/agent-council-record-v2"}}
  }
}

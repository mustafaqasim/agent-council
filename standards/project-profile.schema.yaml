{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "https://agent-council.local/schemas/project-profile-v1",
  "title": "Agent Council project profile",
  "type": "object",
  "required": ["schema_version", "profile_id", "route_floors", "required_evidence"],
  "properties": {
    "schema_version": {"const": "agent-council.project-profile/v1"},
    "profile_id": {"type": "string", "pattern": "^[a-z0-9][a-z0-9-]{0,63}$"},
    "extends": {"type": "string", "pattern": "^[a-z0-9][a-z0-9-]{0,63}$"},
    "description": {"type": "string", "minLength": 1},
    "route_floors": {"type": "object", "minProperties": 1, "additionalProperties": {"enum": ["R1", "R2", "R3"]}},
    "required_evidence": {"type": "object", "minProperties": 1},
    "case_root": {"type": "string", "minLength": 1},
    "compound_engineering": {"type": "object"},
    "authority": {"type": "object"},
    "protected_labs": {"type": "object"}
  },
  "additionalProperties": false
}

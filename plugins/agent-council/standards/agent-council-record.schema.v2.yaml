{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:agent-council:schema:record:v2",
  "title": "Agent Council v2 immutable event record",
  "type": "object",
  "additionalProperties": false,
  "required": ["record_type", "event_id", "event_sha256", "recorded_at", "identity", "candidate_id", "cycle_id", "payload"],
  "properties": {
    "record_type": {"enum": ["case", "packet", "dispatch", "gate", "test", "evidence", "interruption", "resumption", "supersession", "candidate_transition", "closure"]},
    "event_id": {"$ref": "#/$defs/id"}, "event_sha256": {"$ref": "#/$defs/sha256"}, "recorded_at": {"type": "string", "format": "date-time"},
    "identity": {"$ref": "#/$defs/identity"}, "candidate_id": {"$ref": "#/$defs/id"}, "cycle_id": {"$ref": "#/$defs/id"},
    "payload": {"type": "object", "minProperties": 1, "required": ["previous_event_sha256"], "properties": {"previous_event_sha256": {"oneOf": [{"$ref": "#/$defs/sha256"}, {"type": "null"}]}}}
  },
  "$defs": {
    "id": {"type": "string", "pattern": "^[A-Za-z][A-Za-z0-9._-]{2,127}$"},
    "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"},
    "identity": {"type": "object", "additionalProperties": false, "required": ["case_id", "policy_bundle_sha256", "registry_version", "registry_sha256"], "properties": {"case_id": {"$ref": "#/$defs/id"}, "policy_bundle_sha256": {"$ref": "#/$defs/sha256"}, "registry_version": {"type": "string", "pattern": "^v[0-9]+$"}, "registry_sha256": {"$ref": "#/$defs/sha256"}}}
  },
  "allOf": [
    {"if": {"properties": {"record_type": {"enum": ["case", "dispatch", "gate", "closure"]}}}, "then": {"properties": {"payload": {"required": ["system_generated"], "properties": {"system_generated": {"const": true}, "proof": false}}}}},
    {"if": {"properties": {"record_type": {"const": "packet"}}}, "then": {"properties": {"payload": {"required": ["packet_id", "phase", "status"]}}}},
    {"if": {"properties": {"record_type": {"const": "resumption"}}}, "then": {"properties": {"payload": {"required": ["interruption_id", "exact_resumption", "prior_candidate_id"], "properties": {"exact_resumption": {"const": true}}}}}},
    {"if": {"properties": {"record_type": {"const": "supersession"}}}, "then": {"properties": {"payload": {"required": ["supersedes_event_id", "retired_event_id"]}}}}
  ]
}

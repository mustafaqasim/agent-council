{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:agent-council:schema:promotion-proof:v2",
  "title": "Agent Council public v3 promotion proof",
  "description": "Allowlisted public projection exported only after private v1 verification. Hashes commit to evidence but do not authenticate its provider. Native transcripts, loader roots, debug contents, preparation manifests, prompts and rationales are excluded. The source hash is a commitment, not a signature. Runtime recomputes both release identities and exact registry transformation from package bytes.",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version", "evidence_assurance", "provider_authenticity_verified", "native_harness_scoring_replayed", "source_proof_sha256", "candidate_registry", "candidate_release_binding", "promoted_release_binding", "binding_evidence"],
  "properties": {
    "schema_version": {"const": "agent-council.promotion-proof/v2"},
    "evidence_assurance": {"const": "structural_only"},
    "provider_authenticity_verified": {"const": false},
    "native_harness_scoring_replayed": {"const": false},
    "source_proof_sha256": {"$ref": "#/$defs/sha256"},
    "candidate_registry": {
      "type": "object", "additionalProperties": false, "required": ["path", "sha256"],
      "properties": {"path": {"const": "standards/model-qualifications/candidate-registry.v3.json"}, "sha256": {"$ref": "#/$defs/sha256"}}
    },
    "candidate_release_binding": {"$ref": "#/$defs/release_binding"},
    "promoted_release_binding": {"$ref": "#/$defs/release_binding"},
    "binding_evidence": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/binding"}}
  },
  "$defs": {
    "sha256": {"type": "string", "pattern": "^[a-f0-9]{64}$"},
    "nullable_hash": {"anyOf": [{"$ref": "#/$defs/sha256"}, {"type": "null"}]},
    "path": {"type": "string", "minLength": 1, "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.?(?:/|$))(?!.*//)[^\\\\:\\u0000-\\u001f\\u007f]+$"},
    "release_binding": {
      "type": "object", "additionalProperties": false,
      "required": ["schema_version", "behavioral_identity", "eval_suite_sha256"],
      "properties": {
        "schema_version": {"const": "agent-council.release-binding/v1"},
        "eval_suite_sha256": {"$ref": "#/$defs/sha256"},
        "behavioral_identity": {
          "type": "object", "additionalProperties": false,
          "required": ["schema_version", "identity_version", "inventory_sha256", "files_sha256", "behavioral_sha256", "paths"],
          "properties": {
            "schema_version": {"const": "agent-council.behavioral-identity/v1"},
            "identity_version": {"type": "string", "pattern": "^[a-z0-9][a-z0-9._/-]*$"},
            "inventory_sha256": {"$ref": "#/$defs/sha256"}, "files_sha256": {"$ref": "#/$defs/sha256"}, "behavioral_sha256": {"$ref": "#/$defs/sha256"},
            "paths": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"$ref": "#/$defs/path"}}
          }
        }
      }
    },
    "claims": {
      "type": "array", "minItems": 12, "maxItems": 12,
      "items": {
        "type": "object", "additionalProperties": false, "required": ["scenario_id", "claims"],
        "properties": {
          "scenario_id": {"type": "string", "pattern": "^GFT(0[1-9]|1[0-2])$"},
          "claims": {"type": "array", "uniqueItems": true, "items": {"enum": ["route_r1_or_higher", "technical_implementation", "independent_operational_review", "ultimate_routing", "ultimate_final", "route_r3", "ultimate_design", "integration_evidence", "fault_evidence", "separate_symptom_from_cause", "no_blind_repeat", "reject_self_review", "closure_held", "name_independent_review_gap", "reject_lower_tier", "record_required_tier_unavailable", "gate_not_advanced", "new_candidate_cycle", "reject_stale_evidence", "fresh_review", "fresh_native_qualification", "reconcile_ownership", "no_duplicate_unknown_work", "link_resumption", "council_owns_routing", "ce_owns_method", "reuse_exact_receipts", "ordinary_operation_exclusion", "no_full_council", "authorization_preserved", "visible_dispatch_notice", "no_private_reasoning", "worker_disposition_reported", "reject_narrative_only", "file_backed_evidence", "exact_missing_gates", "packaged_default_profile", "no_unrelated_rule_inheritance", "external_authority_unchanged"]}}
        }
      },
      "description": "Verifier requires each GFT01-GFT12 once, only CLAIM_VOCABULARY values, all EXPECTED_CLAIMS and only the scenario's CURRENT_ALLOWED_ADDITIONAL_CLAIMS. This replays claim scoring, not native harness scoring."
    },
    "run": {
      "type": "object", "additionalProperties": false,
      "required": ["run_id", "session_sha256", "parent_session_sha256", "agent_sha256", "turn_sha256", "parent_transcript_sha256", "transcript_sha256", "scenario_claims"],
      "properties": {
        "run_id": {"enum": ["native-forward-run-1", "native-forward-run-2"]},
        "session_sha256": {"$ref": "#/$defs/sha256"}, "parent_session_sha256": {"$ref": "#/$defs/nullable_hash"},
        "agent_sha256": {"$ref": "#/$defs/nullable_hash"}, "turn_sha256": {"$ref": "#/$defs/nullable_hash"},
        "parent_transcript_sha256": {"$ref": "#/$defs/nullable_hash"}, "transcript_sha256": {"$ref": "#/$defs/sha256"},
        "scenario_claims": {"$ref": "#/$defs/claims"}
      }
    },
    "probe": {
      "type": "object", "additionalProperties": false,
      "required": ["session_sha256", "parent_session_sha256", "agent_sha256", "turn_sha256", "parent_transcript_sha256", "transcript_sha256", "scenario_claims", "agent_definition_sha256", "loader_debug_log_sha256"],
      "properties": {
        "session_sha256": {"$ref": "#/$defs/sha256"}, "parent_session_sha256": {"$ref": "#/$defs/sha256"},
        "agent_sha256": {"$ref": "#/$defs/sha256"}, "turn_sha256": {"$ref": "#/$defs/nullable_hash"},
        "parent_transcript_sha256": {"$ref": "#/$defs/sha256"}, "transcript_sha256": {"$ref": "#/$defs/sha256"},
        "scenario_claims": {"anyOf": [{"$ref": "#/$defs/claims"}, {"type": "null"}]},
        "agent_definition_sha256": {"$ref": "#/$defs/nullable_hash"}, "loader_debug_log_sha256": {"$ref": "#/$defs/nullable_hash"}
      }
    },
    "binding": {
      "type": "object", "additionalProperties": false,
      "required": ["binding_id", "identity_assurance", "model_id", "effort", "runs", "probe"],
      "properties": {
        "binding_id": {"type": "string", "pattern": "^[A-Za-z][A-Za-z0-9._-]{2,127}$"},
        "identity_assurance": {"enum": ["host_selected", "transcript_reported"]},
        "model_id": {"type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"},
        "effort": {"enum": [null, "minimal", "low", "medium", "high", "xhigh", "max", "ultra"]},
        "runs": {"type": "array", "minItems": 2, "maxItems": 2, "items": {"$ref": "#/$defs/run"}},
        "probe": {"$ref": "#/$defs/probe"}
      }
    }
  },
  "$comment": "PROOF_PATH remains standards/model-qualifications/promotion.v1.json for compatible consumers; schema_version dispatches v1 private or v2 public verification. Closure is exactly proof plus archived candidate registry. Codex identity is host_selected; Claude transcript_reported is client-written transcript metadata, not provider authentication. Codex runs and probe require distinct child/session/turn/transcript tokens and agent tokens. Claude runs have null parent/agent/turn fields; probe has a distinct agent token and may share parent/child session. Session hashes share one domain across roles. Identifier hashing is SHA256(canonical JSON [agent-council.public-promotion-identifier/v1, candidate behavioral SHA, domain, identifier]); Codex agent identifier is parent session plus NUL plus agent path. Runtime requires matching archived model and default effort, exact selected binding coverage, source hash syntax, archive hash, no inherited qualified rows, and package/proof pins. An offline projection cannot prove source commitments came from a genuine private verifier."
}

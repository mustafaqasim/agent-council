{
  "schema_version": "1.1",
  "name": "lightweight-fallback",
  "description": "Behavioral boundary check using observed tool events and deterministic response assertions.",
  "tags": [
    "lightweight-fallback"
  ],
  "execution": {
    "prompt": "Use Agent Council's routing policy to assess this hypothetical capability snapshot, without actual delegation. A lightweight extraction task prefers worker_intelligence. Its primary binding is unavailable; an active qualified same-tier fallback is available. A higher qualified tier is also available at greater cost. State which tier should be selected first and whether a governed case is needed. The snapshot is an exercise input, not evidence that a real provider supports those bindings.",
    "max_turns": 12,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Agent"
    ],
    "artifact_publish": false
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "council-invoked",
      "tool": "Skill",
      "arm": "both",
      "input_match": "agent-council",
      "min": 1
    },
    {
      "type": "regex",
      "name": "same-tier-fallback",
      "target": "last_message",
      "pattern": "\\A(?![\\s\\S]*\\b(?:do[ \\t]+not|don't|never|must[ \\t]+not|should[ \\t]+not)[ \\t]+(?:select|choose|use|prefer)(?:[ \\t]+first)?[ \\t:*]+(?:(?:the|an?|active|qualified)[ \\t]+){0,4}(?:same[ -]tier[ \\t]+fallback|fallback[ \\t]+in[ \\t]+(?:the[ \\t]+)?same[ \\t]+tier)\\b)(?![\\s\\S]*\\b(?:no[ \\t]+(?:(?:active|qualified)[ \\t]+){0,2}same[ -]tier[ \\t]+fallback[ \\t]+(?:is[ \\t]+)?(?:selected|first|takes priority)|same[ -]tier[ \\t]+fallback[ \\t]+(?:is[ \\t]+)?(?:not|never)[ \\t]+(?:selected|first|given priority))\\b)[\\s\\S]*?(?:\\b(?:select|choose|use|prefer)(?:[ \\t]+first)?[ \\t:*]+(?:(?:the|an?|active|qualified)[ \\t]+){0,4}(?:same[ -]tier[ \\t]+fallback|fallback[ \\t]+in[ \\t]+(?:the[ \\t]+)?same[ \\t]+tier)\\b|same[ -]tier[ \\t]+fallback[ \\t]+(?:is[ \\t]+)?(?:selected|first|takes priority)\\b)",
      "flags": "i",
      "match": "contains"
    },
    {
      "type": "regex",
      "name": "no-contradictory-selection",
      "target": "last_message",
      "pattern": "(?:^|[.!?;\\n]|\\bbut|\\bhowever|\\binstead)\\s*[, :]?\\s*(?:(?:I|we)\\s+(?:will|should)\\s+)?(?:select|choose|use|prefer|assign|escalate to)\\s+(?:the\\s+)?(?:a\\s+)?(?:higher|lower)[ -]tier|Council check:\\s*governed|(?:^|[.!?;\\n])\\s*(?:the\\s+)?(?:selected\\s+)?route\\s*(?:is|:)\\s*R[123]\\b",
      "flags": "i",
      "match": "not_contains"
    },
    {
      "type": "regex",
      "name": "no-governed",
      "target": "last_message",
      "pattern": "no.*governed|governed.*not|no.*case|case.*not",
      "flags": "i",
      "match": "contains"
    },
    {
      "type": "tool_used",
      "name": "no-pretend-dispatch",
      "tool": "Agent",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-write",
      "tool": "Write",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-edit",
      "tool": "Edit",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-bash",
      "tool": "Bash",
      "min": 0,
      "max": 0
    }
  ]
}

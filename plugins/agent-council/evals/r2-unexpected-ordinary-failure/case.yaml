{
  "schema_version": "1.1",
  "name": "r2-unexpected-ordinary-failure",
  "description": "Behavioral boundary check using observed tool events and deterministic response assertions.",
  "tags": [
    "R2",
    "ordinary-vs-qualification-failure"
  ],
  "execution": {
    "prompt": "Fix a product report that unexpectedly returns an empty table for valid records. The expected behavior previously worked; the cause is unknown. It is ordinary product behavior, with no evidence of model qualification, shared-contract, safety, lifecycle, or acceptance-boundary failure. First give the governance route and initial evidence needed, then stop before implementation. No mutation is authorized in this initial step.",
    "max_turns": 12,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep",
      "Agent"
    ],
    "artifact_publish": false
  },
  "runs": 3,
  "graders": [
    {
      "type": "tool_used",
      "name": "council-invoked",
      "tool": "Skill",
      "arm": "both",
      "input_match": "agent-council",
      "min": 1
    },
    {
      "type": "regex",
      "name": "r2-route",
      "target": "last_message",
      "pattern": "governed case R2|\\bR2\\b",
      "flags": "i",
      "match": "contains"
    },
    {
      "type": "regex",
      "name": "not-qualification",
      "target": "last_message",
      "pattern": "governed case R3",
      "flags": "i",
      "match": "not_contains"
    },
    {
      "type": "tool_used",
      "name": "no-write",
      "tool": "Write",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-edit",
      "tool": "Edit",
      "min": 0,
      "max": 0
    },
    {
      "type": "tool_used",
      "name": "no-bash",
      "tool": "Bash",
      "min": 0,
      "max": 0
    }
  ]
}

schema_version: "agent-council.review-lenses/v1"
purpose: "Concrete independent review checks. Reviewers use only the accepted packet, raw artifacts, and candidate evidence needed for the lens."

lenses:
  architecture:
    owner: "ultimate_intelligence for R2 and R3, independent operational_intelligence for implementation review"
    checks:
      - "Name one authoritative owner for every changed policy and trace producer, consumer, dependency, and failure paths."
      - "Confirm a local repair is sufficient, or require the shared contract change."
      - "Compare reuse, bounded consolidation, and new component options when a boundary changes."
      - "Reject wrappers that only overwrite inherited pins, aliases, selections, or output shapes."
      - "Define interruption recovery before a state-promotion change."
  root_cause:
    owner: "ultimate_intelligence with operational_intelligence evidence coordination"
    checks:
      - "Separate symptom, trigger, proximate failure, causal mechanism, hypothesis, and remaining uncertainty."
      - "Require a discriminating reproduction, trace, or primary evidence for each causal claim."
      - "Require a regression that fails before and passes after repair when reproducible."
      - "For concurrency or recovery, exercise actual entry points and cross-process boundaries."
  integration:
    owner: "Independent operational_intelligence"
    checks:
      - "Compare final changed paths with packet ownership and baseline hashes."
      - "Detect shared-file write conflicts and identify one integration owner."
      - "Verify tested source, package, dependency, harness, and policy identities match the review candidate."
      - "Reject preparation-only, historical, or mixed-candidate evidence as acceptance."
  adversarial:
    owner: "Independent operational_intelligence, with technical_tactical_intelligence test execution where authorized"
    checks:
      - "Exercise relevant invalid input, replay, interruption, failure cleanup, and no-change controls."
      - "Inject the missing safeguard or wrong identity where practical and prove the gate detects it."
      - "Stop campaign launches after one unexpected live failure and return to diagnosis."
  evidence:
    owner: "operational_intelligence, worker_intelligence may collect mechanically"
    checks:
      - "Validate hashes, timestamps, candidate bindings, event chain links, and explicit not-applicable reasons."
      - "Keep missing and contradictory evidence visible; narrative success claims are not receipts."
      - "Ensure no secrets, credential-derived verifiers, raw approvals, or process dumps enter case artifacts."

disposition:
  pass: "All applicable checks have candidate-bound receipts and no blocking finding."
  needs_evidence: "A required observation, identity, receipt, or discriminating test is absent."
  needs_decision: "Scope, contract, route, ownership, or authorization boundary needs the assigned authority."
  fail: "A required acceptance condition fails, final bytes differ, a safeguard is bypassed, or independence is invalid."

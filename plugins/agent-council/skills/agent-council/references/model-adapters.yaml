schema_version: "agent-council.model-adapters/v1"
purpose: "Platform-specific dispatch rules for registry-bound, project-neutral capability tiers."

registry:
  artifact: "standards/agent-model-registry.v2.yaml"
  designation_receipt: "standards/model-qualifications/initial-codex-designation.v2.yaml"
  rules:
    - "Resolve a tier to an active registry binding only after a fast runtime availability and compatibility check."
    - "For a governed case, pin registry version and registry SHA-256 for the active case cycle."
    - "For a governed case, pin binding ID and binding SHA-256 for every dispatch."
    - "A registry review-due date warns only. Explicit hard expiry or revocation blocks a binding."
    - "Unknown or new models are candidates only and cannot receive a tier gate before qualification and plugin update."
    - "A local structural designation does not prove native provider provenance or satisfy a closure gate."
    - "Each governed-case dispatch plan is an immutable single-use request bound to the current case, candidate, cycle, policy, registry, binding, model, effort, context, decision kind, and qualification run when applicable."
    - "Candidate changes and cycle-only resumptions invalidate every unconsumed governed-case dispatch plan."

common:
  user_notice:
    format: "Council: <model>/<effort> (<cost_class>) assigned <task> because <brief reason>."
    cost_classes:
      ultimate_intelligence: "premium"
      operational_intelligence: "premium"
      technical_tactical_intelligence: "standard"
      worker_intelligence: "economical"
    rules:
      - "Show the notice before every dispatch."
      - "Keep the reason to one sentence and state the observable routing factor."
      - "After completion, show the disposition and evidence produced."
      - "Do not expose private reasoning or internal deliberation."
  lightweight_dispatch:
    - "Resolve the lowest qualified active binding that can complete the bounded task reliably."
    - "Honor an explicit user model or effort preference when it is compatible with the selected qualified binding, route, and native tool support. A preference never lowers a qualification floor or grants unavailable authority."
    - "When the preferred binding is unavailable, use an active same-tier fallback first. Use the next higher qualified tier only when the expected benefit still exceeds its cost; otherwise report the limitation and continue by direct execution."
    - "Never substitute a lower tier that is unlikely to complete the task reliably."
    - "Show the user notice, then use the platform's native delegation tool with the explicit registry model ID and effort."
    - "Keep the returned task identity, model, context, disposition, and evidence visible in the active transcript."
    - "Do not create a Council case, immutable dispatch plan, or durable Council receipt solely for lightweight routing."
    - "End the active conversation with a compact receipt of actual observed model and effort, outcome, evidence, and limitations. State no delegation when none occurred. Do not persist a lightweight log or claim savings that were not observed."
    - "Escalate to governed-case dispatch before continuing if new evidence reveals a qualifying risk trigger."
  routing_precedence:
    - "Evaluate user scope, authority, and council_reentry before risk. council_reentry: denied returns evidence to the owning case and does not invoke nested Council routing."
    - "Evaluate qualifying risk before economics. A risk trigger overrides task size and projected delegation benefit; choose the highest applicable R1, R2, or R3 route."
    - "When no qualifying risk applies, choose direct execution or lightweight routing by observable net benefit after coordination cost."
    - "Reassess only on material evidence changing scope, authority, cause, contract, safety, acceptance, qualification, or repeated-failure facts."
  lightweight_effort_and_fanout:
    - "Use minimal or low effort for mechanical, extraction, formatting, and deterministic bounded work; medium for bounded implementation, structured analysis, and drafting; high only for difficult bounded judgment."
    - "Use the smallest useful independent fanout. Escalate one tier or effort step only when returned evidence shows insufficiency, material task expansion, or an in-scope qualifying risk trigger."
  governed_case_required_receipt:
    - "case_id, cycle_id, packet_id, policy_sha256, registry_version, registry_sha256, and prompt_sha256"
    - "binding_id, binding_sha256, requested_tier, effective_tier, model_id, reasoning, and adapter"
    - "capability snapshot, availability status, compatibility result, and fallback disposition"
    - "attested agent identity, context lineage, native invocation or trusted adapter reference, and output references"
  assurance:
    explicit_tool_selection: "A native tool accepted an explicit supported model argument."
    provider_attested: "The provider returned the resolved model identity."
    unverified: "A prompt role, prompt model name, or self-description only."
  rules:
    - "Unverified selection never satisfies an ultimate_intelligence gate."
    - "Only an active same-tier binding may be used as a same-tier fallback."
    - "For a governed gate, a higher-tier substitution requires a registry binding that explicitly permits it and a recorded reason. Lightweight routing may select an independently qualified higher tier under the lightweight fallback rule."
    - "A lower tier never substitutes for an ultimate_intelligence gate."
    - "Use clean context for independent review and forward tests."
    - "Require two fresh candidate-bound native forward-test receipts before operational promotion or affected acceptance closure."
    - "A capability or dispatch receipt proves authority provenance only; it cannot serve as behavioral test, review, gate, or closure evidence."
    - "A review must follow the implementation, packet result, tests, and referenced behavioral evidence it evaluates."
    - "An active hold or rejected disposition blocks the affected review or qualification run until explicitly superseded."
    - "Do not store secrets, raw approval transcripts, private reasoning traces, cookies, tokens, or credential-bearing endpoints in a receipt."

codex:
  mechanism: "Use native collaboration spawn, message, follow-up, and wait APIs for internal council work."
  procedure:
    - "Inspect the callable tool's supported model identifiers before dispatch."
    - "Resolve the requested tier through the active registry binding and record its designation receipt."
    - "Pass the explicit registry model ID and requested reasoning setting when the native tool supports them."
    - "Record the returned agent identity, context lineage, and native invocation reference."
    - "Use collaboration subtasks, never user-owned desktop tasks, for council internals."
  prohibition: "A model name in the worker prompt is not a model-selection receipt."

claude_code:
  mechanism: "Use the Agent tool with an explicit model parameter to dispatch work to Claude Code subagents."
  status: "Qualified only for active v2 bindings. Opus 5.5 is the intended operational successor candidate and awaits native qualification."
  assurance_level: "explicit_tool_selection"
  delegation_tool: "Agent tool (model parameter set to the registry model_id for the requested tier)"
  procedure:
    - "Resolve the requested tier through the active registry binding."
    - "Inspect the Agent tool's supported model identifiers before dispatch."
    - "Pass the explicit registry model_id in the Agent tool's model parameter."
    - "Record the returned subagent output reference, task identity, and context identity."
    - "Use clean, self-contained subagent contexts for independent review and forward tests."
    - "The Agent tool model parameter constitutes explicit_tool_selection assurance when the provider accepts and reflects the specified model_id."
  tier_bindings:
    ultimate_intelligence: "claude-code-v2-ultimate -> claude-fable-5-1"
    operational_intelligence: "claude-code-v2-operational -> claude-opus-5"
    technical_tactical_intelligence: "claude-code-v2-technical -> claude-sonnet-5"
    worker_intelligence: "claude-code-v2-worker -> claude-haiku-4-5-20251001"
  candidate_bindings:
    operational_intelligence: "claude-code-v2-operational-opus-5-5 -> claude-opus-5-5, intended successor awaiting qualification"
  unavailable:
    disposition: "Record required_tier_binding_unavailable and hold the dependent engineering gate."
    permitted_progress: ["Authorized read-only evidence gathering", "Packet preparation", "Ordinary excluded operations"]
  prohibited: ["Embedded API keys", "New credential storage", "Silent third-party uploads", "Headless one-shot CLI workarounds", "New broker, scheduler, database, or persistent orchestrator"]

availability:
  transient: "Retry only demonstrably transient failures with bounded waits, retained identity, and the same pinned registry binding."
  quota_or_missing_model: "Do not retry unchanged state indefinitely, relabel a model, or lower the required tier."
  interrupted: "Rebuild from immutable records, link the interruption to the prior event and candidate, inspect task and process ownership, resume only unfinished packets, and record the exact new cycle."

schema_version: "agent-council.model-adapters/v1"
purpose: "Platform-specific dispatch rules for registry-bound, project-neutral capability tiers."

registry:
  artifact: "standards/agent-model-registry.v2.yaml"
  designation_receipt: "standards/model-qualifications/initial-codex-designation.v2.yaml"
  rules:
    - "Resolve a tier to an active registry binding only after a fast runtime availability and compatibility check."
    - "Pin registry version and registry SHA-256 for the active case cycle."
    - "Pin binding ID and binding SHA-256 for every dispatch."
    - "A registry review-due date warns only. Explicit hard expiry or revocation blocks a binding."
    - "Unknown or new models are candidates only and cannot receive a tier gate before qualification and plugin update."
    - "A local structural designation does not prove native provider provenance or satisfy a closure gate."
    - "Each dispatch plan is an immutable single-use request bound to the current case, candidate, cycle, policy, registry, binding, model, effort, context, decision kind, and qualification run when applicable."
    - "Candidate changes and cycle-only resumptions invalidate every unconsumed dispatch plan."

common:
  user_notice:
    format: "Council: <model>/<effort> (<cost_class>) assigned <task> because <brief reason>."
    cost_classes:
      ultimate_intelligence: "premium"
      operational_intelligence: "premium"
      technical_tactical_intelligence: "standard"
      worker_intelligence: "economical"
    rules:
      - "Show the notice before every dispatch."
      - "Keep the reason to one sentence and state the observable routing factor."
      - "After completion, show the disposition and evidence produced."
      - "Do not expose private reasoning or internal deliberation."
  required_receipt:
    - "case_id, cycle_id, packet_id, policy_sha256, registry_version, registry_sha256, and prompt_sha256"
    - "binding_id, binding_sha256, requested_tier, effective_tier, model_id, reasoning, and adapter"
    - "capability snapshot, availability status, compatibility result, and fallback disposition"
    - "attested agent identity, context lineage, native invocation or trusted adapter reference, and output references"
  assurance:
    explicit_tool_selection: "A native tool accepted an explicit supported model argument."
    provider_attested: "The provider returned the resolved model identity."
    unverified: "A prompt role, prompt model name, or self-description only."
  rules:
    - "Unverified selection never satisfies an ultimate_intelligence gate."
    - "Only an active same-tier binding may be used as a same-tier fallback."
    - "A higher-tier substitution requires a registry binding that explicitly permits it and a recorded reason."
    - "A lower tier never substitutes for an ultimate_intelligence gate."
    - "Use clean context for independent review and forward tests."
    - "Require two fresh candidate-bound native forward-test receipts before operational promotion or affected acceptance closure."
    - "A capability or dispatch receipt proves authority provenance only; it cannot serve as behavioral test, review, gate, or closure evidence."
    - "A review must follow the implementation, packet result, tests, and referenced behavioral evidence it evaluates."
    - "An active hold or rejected disposition blocks the affected review or qualification run until explicitly superseded."
    - "Do not store secrets, raw approval transcripts, private reasoning traces, cookies, tokens, or credential-bearing endpoints in a receipt."

codex:
  mechanism: "Use native collaboration spawn, message, follow-up, and wait APIs for internal council work."
  procedure:
    - "Inspect the callable tool's supported model identifiers before dispatch."
    - "Resolve the requested tier through the active registry binding and record its designation receipt."
    - "Pass the explicit registry model ID and requested reasoning setting when the native tool supports them."
    - "Record the returned agent identity, context lineage, and native invocation reference."
    - "Use collaboration subtasks, never user-owned desktop tasks, for council internals."
  prohibition: "A model name in the worker prompt is not a model-selection receipt."

claude_code:
  mechanism: "Use only a registry-qualified native delegation control or a pre-existing trusted cross-model adapter."
  status: "Council execution fails closed until a separately qualified v2 binding and native receipts exist."
  runtime_check:
    - "Inspect the installed delegation schema and actual model controls."
    - "Record actual native model IDs, adapter identity, availability, compatibility, and a completed qualification receipt before enabling a binding."
    - "Do not infer availability or model identity from documentation or a worker claim."
  unavailable:
    disposition: "Record required_tier_binding_unavailable and hold the dependent engineering gate."
    permitted_progress: ["Authorized read-only evidence gathering", "Packet preparation", "Ordinary excluded operations"]
  prohibited: ["Embedded API keys", "New credential storage", "Silent third-party uploads", "Headless one-shot CLI workarounds", "New broker, scheduler, database, or persistent orchestrator"]

availability:
  transient: "Retry only demonstrably transient failures with bounded waits, retained identity, and the same pinned registry binding."
  quota_or_missing_model: "Do not retry unchanged state indefinitely, relabel a model, or lower the required tier."
  interrupted: "Rebuild from immutable records, link the interruption to the prior event and candidate, inspect task and process ownership, resume only unfinished packets, and record the exact new cycle."
